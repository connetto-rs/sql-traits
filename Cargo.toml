[package]
name = "sql-traits"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
authors = ["Earth Metabolome Initiative"]
license = "MIT"
repository = "https://github.com/connetto-rs/sql-traits"
description = "Rust traits describing SQL-like objects"
readme = "README.md"
keywords = ["sql", "traits", "parser", "geometry"]
categories = ["database", "parsing", "geometry"]
autotests = false

[features]
default = ["std"]
# The standard library, filesystem-backed construction and the `std`-only stack-overflow guards.
std = [
    "sqlparser/std",
    "sqlparser/recursive-protection",
    "dep:recursive",
    "dep:stacker",
    "geometric-traits/std",
    "thiserror/std",
    "sqlparser-plpgsql/std",
    "sqlparser-canonicalize?/std",
    "sqlparser-expr-eval/std",
    "sqlparser-plpgsql-dataflow/std",
]
# Adds git-backed construction: `ParserDB::from_git_url*` clones a remote
# repository into a temporary directory and parses the SQL it contains.
# Pulls in the native `git2` (libgit2) and `tempfile` dependencies, so it
# is kept out of the default set and implies `std`.
git = [
    "std",
    "dep:git2",
    "dep:tempfile",
]
# `Serialize` and `Deserialize` for persisted names, collation facts and session setting values, `no_std` through `serde/alloc`.
serde = ["dep:serde"]
# Implements sqlparser-canonicalize's `SemanticContext` through
# `SemanticProofs`, so canonical text spells the casts and constants
# PostgreSQL derives for an expression. Kept `no_std`-compatible.
canonicalize = ["dep:sqlparser-canonicalize"]
# rls-parity's recorded cases and the judgement of one engine against them, as the `parity` module.
parity-fixtures = ["std", "serde", "dep:serde_json", "dep:toml"]

[dependencies]
sqlparser = { version = "0.64", default-features = false, features = ["visitor"] }
recursive = { version = "0.1.1", optional = true }
# Grows the stack for a guard whose margin is wider than `recursive`'s.
stacker = { version = "0.1.25", optional = true }
geometric-traits = { version = "0.2.3", default-features = false, features = ["alloc"] }
thiserror = { version = "2.0", default-features = false }
sqlparser-plpgsql = { git = "https://github.com/connetto-rs/sqlparser-plpgsql", branch = "main", default-features = false, features = ["body-parse"] }
sqlstate = "0.2"
git2 = { version = "0.20.3", optional = true }
tempfile = { version = "3.25", optional = true }
sha2 = { version = "0.10", default-features = false }
unicode-normalization = { version = "0.1", default-features = false }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"], optional = true }
once_cell = { version = "1.21", default-features = false, features = ["race", "alloc"] }
sql-values = { git = "https://github.com/connetto-rs/sql-values", branch = "main", default-features = false, features = ["tzdb"] }
sqlparser-expr-eval = { git = "https://github.com/connetto-rs/sqlparser-expr-eval", branch = "main", default-features = false }
sqlparser-plpgsql-dataflow = { git = "https://github.com/connetto-rs/sqlparser-plpgsql-dataflow", branch = "main", default-features = false }
# Lends a table attribute out of the shared table node, so the node holds the only copy.
yoke = { version = "0.8.4", default-features = false, features = ["alloc"] }
sqlparser-canonicalize = { git = "https://github.com/connetto-rs/sqlparser-canonicalize", branch = "main", default-features = false, optional = true }
serde_json = { version = "1.0", optional = true }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"], optional = true }

# Follow upstream parser and comment APIs.
[patch.crates-io]
sqlparser = { git = "https://github.com/apache/datafusion-sqlparser-rs", branch = "main" }

[lints.rust]
missing_docs = "forbid"
unused_macro_rules = "forbid"
unconditional_recursion = "forbid"
unreachable_patterns = "forbid"
unused_import_braces = "forbid"
unused_must_use = "forbid"
deprecated = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)", "cfg(coverage_nightly)"] }

[lints.rustdoc]
broken_intra_doc_links = "forbid"
bare_urls = "forbid"
invalid_codeblock_attributes = "forbid"
invalid_html_tags = "forbid"
missing_crate_level_docs = "forbid"
unescaped_backticks = "forbid"
redundant_explicit_links = "forbid"
invalid_rust_codeblocks = "forbid"

[lints.clippy]
unreadable_literal = "allow"
missing_panics_doc = "allow"
new_ret_no_self = "allow"
struct_excessive_bools = "allow"
should_panic_without_expect = "allow"
doc_markdown = "allow"
clone_on_copy = "forbid"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "deny", priority = -1 }

[dev-dependencies]
arbitrary = "1.4"
proptest = "1.7"
serde_json = "1.0"
toml = "1"

# Every integration test is a module of this one binary, see tests/it/main.rs.
[[test]]
name = "it"
path = "tests/it/main.rs"

[workspace]
exclude = ["fuzz"]

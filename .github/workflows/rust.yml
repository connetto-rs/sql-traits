name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# A newer push to a pull request cancels the run it supersedes. Every run on
# main gets its own group, so each landed commit keeps its verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Build and Test
    # Linux only. The macOS and Windows runners bill at several times the
    # Linux rate and this crate has no platform-specific code to cover.
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
    - name: Rust Cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
    - name: Run tests
      run: cargo test --all-targets --features git,serde

  msrv:
    name: MSRV
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Read MSRV
      id: msrv
      run: |
        version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "sql-traits") | .rust_version')
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Install MSRV
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: ${{ steps.msrv.outputs.version }}
    - name: Rust Cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
    - name: Check library feature combinations
      run: |
        cargo check --locked -p sql-traits --lib --all-features
        cargo check --locked -p sql-traits --lib
        cargo check --locked -p sql-traits --lib --features serde
        cargo check --locked -p sql-traits --lib --features git
        cargo check --locked -p sql-traits --lib --no-default-features
        cargo check --locked -p sql-traits --lib --no-default-features --features serde

  no_std:
    name: no_std + alloc build
    # Verifies the library is truly `no_std + alloc`-portable, in two
    # layers:
    #
    #   1. Host build with `--no-default-features`: catches accidental
    #      `std::*` references introduced into the library tree.
    #   2. Cross-compile to two real targets with no host-side `std`
    #      backend:
    #        - `thumbv7em-none-eabihf` — bare-metal ARM Cortex-M.
    #        - `wasm32-unknown-unknown` — WebAssembly without WASI.
    #      Either failing would surface a hidden `std`-dependency that
    #      the host check missed.
    #
    # Tests under `cargo test` still run with the `std` default
    # feature (covered by the `test` job above), since the standard
    # libtest harness itself requires `std`. Running the suite under
    # `wasm32-*` would require a `wasm-bindgen-test` rewrite of every
    # test — out of scope; the cross-compile check is the practical
    # "works in wasm" gate for a no-IO library.
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Install Rust + no_std cross-compile targets
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
        targets: thumbv7em-none-eabihf, wasm32-unknown-unknown
    - name: Rust Cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
    - name: Build lib (host, no default features → no_std + alloc)
      run: cargo build --lib --no-default-features
    - name: Clippy under no_std
      run: cargo clippy --lib --no-default-features -- -D warnings
    - name: Cross-compile lib for thumbv7em-none-eabihf (bare-metal ARM)
      run: cargo build --lib --no-default-features --target thumbv7em-none-eabihf
    - name: Cross-compile lib for wasm32-unknown-unknown (WebAssembly)
      run: cargo build --lib --no-default-features --target wasm32-unknown-unknown
    - name: Build lib and cross-compile it with the serde feature
      run: |
        cargo build --lib --no-default-features --features serde
        cargo clippy --lib --no-default-features --features serde -- -D warnings
        cargo build --lib --no-default-features --features serde --target thumbv7em-none-eabihf
        cargo build --lib --no-default-features --features serde --target wasm32-unknown-unknown
    - name: Run full test suite under default features
      run: cargo test --all-targets

  fmt:
    name: Rustfmt
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rustfmt
    - name: Check formatting
      run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - name: Rust Cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
    - name: Run clippy
      run: cargo clippy --all-targets --features git,serde -- -D warnings

  doc:
    name: Documentation
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Rust Cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
    - name: Check documentation
      run: cargo doc --no-deps --document-private-items --features git,serde
      env:
        RUSTDOCFLAGS: -D warnings

  coverage:
    name: Code Coverage
    runs-on: ubuntu-26.04
    # Coverage maps need no debug info, and each persisted doctest binary otherwise carries it.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    # Nightly, because doctest coverage is measured with `--doc`.
    - name: Install Rust
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: llvm-tools-preview
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov
    - name: Measure all targets
      run: cargo llvm-cov --workspace --all-targets --features git,serde --no-report
    - name: Measure doctests and write the report
      run: cargo llvm-cov --workspace --doc --features git,serde --no-clean --lcov --output-path target/coverage.lcov
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: target/coverage.lcov
        fail_ci_if_error: false
